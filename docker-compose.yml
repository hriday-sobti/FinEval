version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: fineval_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: fineval_user
      POSTGRES_PASSWORD: fineval_password
      POSTGRES_DB: fineval_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fineval_user -d fineval_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
