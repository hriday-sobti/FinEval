[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fineval"
version = "0.1.0"
description = "Financial AI Response Quality & Prompt Operations Lab"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Hriday Singh Sobti", email = "hridaysobti@gmail.com" }]
license = { text = "Apache-2.0" }
dependencies = [
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "pyyaml>=6.0.1",
    "pandas>=2.2.0",
    "sqlalchemy>=2.0.30",
    "psycopg>=3.1.18",
    "psycopg-binary>=3.1.18",
    "httpx>=0.27.0",
    "streamlit>=1.35.0",
    "plotly>=5.22.0",
    "python-dotenv>=1.0.1",
    "reportlab>=4.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "ruff>=0.4.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
