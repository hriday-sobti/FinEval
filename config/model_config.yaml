# FinEval LLM & Provider Configuration
version: "1.0"

default_provider: "mock" # options: "mock", "live"

providers:
  mock:
    deterministic: true
    latency_simulate_ms: 120
    failure_simulation_enabled: true

  live:
    default_model: "gpt-4o-mini"
    temperature: 0.0
    timeout_seconds: 30
    max_retries: 3
    retry_backoff_factor: 1.5
    supported_models:
      - "gpt-4o-mini"
      - "gpt-4o"
      - "claude-3-5-sonnet-20241022"
      - "claude-3-haiku-20240307"

judge:
  default_provider: "mock"
  default_model: "gpt-4o-mini"
  temperature: 0.0
  timeout_seconds: 30
  max_retries: 2
